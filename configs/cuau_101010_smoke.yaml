# ──────────────────────────────────────────────────────────────────────────────
# cuau_101010_smoke.yaml
#
# Smoke-test config: 3 epochs, small batch, eval every epoch.
# Purpose: verify the training pipeline runs end-to-end without errors.
# ──────────────────────────────────────────────────────────────────────────────

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  train_h5: data/hdf5/train_20260304.h5
  test_h5:  data/hdf5/test_20260304.h5
  val_fraction: 0.1
  val_seed: 42
  num_workers: 4

# ── Image encoder ─────────────────────────────────────────────────────────────
image_encoder:
  d_model: 256
  K_fourier: 10
  pretrained_cnn: false
  aggregator_method: 1
  n_latents: 32
  n_heads: 8
  L_cross: 1
  L_self: 2
  d_proj: 128
  beta_init: 1.0
  sigma_init: 0.5
  L_blocks: 2

# ── Structure encoder ─────────────────────────────────────────────────────────
structure_encoder:
  hidden_dim: 128
  n_layers: 4
  d_out: 256
  d_proj: 128
  max_atomic_num: 118

# ── Graph construction ────────────────────────────────────────────────────────
graph:
  r_c: 5.0
  K_rbf: 50
  max_num_neighbors: 64

# ── Contrastive loss ──────────────────────────────────────────────────────────
contrastive:
  log_temp_init: 2.6593
  temp_min: 0.01
  temp_max: 1.0

# ── Training (SMOKE TEST) ────────────────────────────────────────────────────
training:
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  warmup_epochs: 1
  epochs: 3
  batch_size: 32            # per-GPU batch size (effective = 32 × 4 GPUs = 128)
                            # InfoNCE gathers all 128 embeddings across GPUs
  accumulate_grad_batches: 1
  grad_clip_norm: 1.0
  eval_every_n_epochs: 1
